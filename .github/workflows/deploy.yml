name: deploy CI/CD project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy over SSH and run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "Creating project folder if it doesn't exist!"
            mkdir -p /root
            cd /root

            if [ ! -d "crmbackend7/.git" ]; then
              echo "Cloning repository!"
              git clone https://github.com/XushvaqtovSardor/crmbackend7
            else
              echo "Pulling latest changes!"
              cd crmbackend7
              git pull origin main
              cd ..
            fi

            # ALWAYS enter project directory
            cd crmbackend7

            echo "Stopping containers"
            docker compose down

            echo "Building containers"
            docker compose build --no-cache app

            echo "Running containers"
            docker compose up -d

            if command -v nginx >/dev/null 2>&1; then
              echo "Applying Nginx upload size limit for large lesson videos"
              printf 'client_max_body_size 600M;\n' > /etc/nginx/conf.d/erp-upload-limit.conf

              nginx -t
              if command -v systemctl >/dev/null 2>&1; then
                systemctl reload nginx || nginx -s reload
              else
                nginx -s reload
              fi
            else
              echo "Nginx not found on host, skipping upload limit setup"
            fi

            echo "Waiting for services to be ready"
            sleep 10

            echo "Checking container status"
            docker compose ps

            echo "Checking app logs"
            docker compose logs --tail=50 app
